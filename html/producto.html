<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuidado con el Gato</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="box-border bg-violet-100 min-h-screen">
    <header
      class="sticky top-0 z-50 bg-fuchsia-200 font-bold text-pink-950 shadow-lg"
    >
      <div
        class="max-w-screen-xl mx-auto px-3 h-12 md:h-14 flex items-center justify-between relative"
      >
        <a href="../index.html" class="flex items-center gap-2 min-w-0">
          <img
            src="../img/logo_gato.png"
            class="h-8 w-8 md:h-10 md:w-10 object-contain"
            alt="Logo"
          />
          <span class="text-base md:text-2xl font-semibold"
            >Cuidado con el Gato</span
          >
        </a>

        <div class="flex items-center gap-1">
          <!-- Menu-->
          <nav class="hidden md:block" aria-label="Principal">
            <ul class="flex items-center gap-8 text-base">
              <li>
                <a
                  href="../index.html"
                  class="py-1 px-2 rounded hover:bg-fuchsia-100"
                  >Inicio</a
                >
              </li>
              <li>
                <a
                  href="producto.html"
                  class="py-1 px-2 rounded hover:bg-fuchsia-100"
                  >Productos</a
                >
              </li>
              <li>
                <a
                  href="contacto.html"
                  class="py-1 px-2 rounded hover:bg-fuchsia-100"
                  >Contacto</a
                >
              </li>
            </ul>
          </nav>

          <!--Carrito-->
          <a
            href="cart.html"
            aria-label="Carrito"
            class="inline-flex items-center gap-1 py-1 px-2 rounded hover:bg-fuchsia-100"
          >
            <img
              src="../img/carrito.png"
              alt=""
              class="h-5 w-5 md:h-6 md:w-6 object-contain"
            />
            <span id="cuenta-carrito">0</span>
          </a>

          <!-- Botón hamburguesa  -->
          <button
            id="btn-menu"
            type="button"
            aria-label="Abrir menú"
            aria-expanded="false"
            aria-controls="menu-movil"
            class="md:hidden p-2 rounded hover:bg-fuchsia-100"
          >
            <svg
              class="h-6 w-6"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              viewBox="0 0 24 24"
            >
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
        </div>

        <!-- Menu -->
        <nav
          id="menu-movil"
          class="hidden md:hidden absolute top-full inset-x-0 bg-fuchsia-200 border-t border-pink-950/15 shadow-lg"
          aria-label="Principal móvil"
        >
          <ul class="flex flex-col py-1">
            <li>
              <a
                href="../index.html"
                class="block px-5 py-3 hover:bg-fuchsia-100"
                >Inicio</a
              >
            </li>
            <li>
              <a
                href="producto.html"
                class="block px-5 py-3 hover:bg-fuchsia-100"
                >Productos</a
              >
            </li>
            <li>
              <a
                href="contacto.html"
                class="block px-5 py-3 hover:bg-fuchsia-100"
                >Contacto</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <h1 class="mt-6 mb-8 text-3xl md:text-5xl font-black text-pink-700 text-center">
        Nuestros productos
      </h1>
      <section
        id="productos-contenedor"
        class="flex flex-wrap justify-center gap-5 mx-auto"
      ></section>
    </main>

    <footer class="px-5 py-6 border-t-2 border-pink-950 text-center text-sm">
      <p>Todos los derechos reservados &copy; 2026 Cuidado Con el Gato</p>
    </footer>

    <script src="../js/ropa.js"></script>
    <script src="../js/cartService.js"></script>
    <script src="../js/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.2/flowbite.min.js"></script>
    <script>
      // Abrir y cerrar el menu desplegable
      const botonMenu = document.getElementById("btn-menu");
      const menuMovil = document.getElementById("menu-movil");
      botonMenu.addEventListener("click", () => {
        const abierto = menuMovil.classList.toggle("hidden") === false;
        botonMenu.setAttribute("aria-expanded", abierto);
      });
    </script>
  </body>
</html>
