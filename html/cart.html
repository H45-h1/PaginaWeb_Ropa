<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito de compra</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="box-border bg-violet-100 min-h-screen flex flex-col">
    <header
      class="sticky top-0 z-50 bg-fuchsia-200 font-bold text-pink-950 shadow-lg"
    >
      <div
        class="max-w-screen-xl mx-auto px-3 h-12 md:h-14 flex items-center justify-between relative"
      >
        <a href="../index.html" class="flex items-center gap-2 min-w-0">
          <img
            src="../img/logo_gato.png"
            class="h-8 w-8 md:h-10 md:w-10 object-contain"
            alt="Logo"
          />
          <span class="text-base md:text-2xl font-semibold truncate"
            >Cuidado con el Gato</span
          >
        </a>

        <div class="flex items-center gap-1">
          <!-- Menú de escritorio -->
          <nav class="hidden md:block" aria-label="Principal">
            <ul class="flex items-center gap-8 text-base">
              <li>
                <a
                  href="../index.html"
                  class="py-1 px-2 rounded hover:bg-fuchsia-100"
                  >Inicio</a
                >
              </li>
              <li>
                <a
                  href="producto.html"
                  class="py-1 px-2 rounded hover:bg-fuchsia-100"
                  >Productos</a
                >
              </li>
              <li>
                <a
                  href="contacto.html"
                  class="py-1 px-2 rounded hover:bg-fuchsia-100"
                  >Contacto</a
                >
              </li>
            </ul>
          </nav>

          <!-- Carrito -->
          <a
            href="cart.html"
            aria-label="Carrito"
            class="inline-flex items-center gap-1 py-1 px-2 rounded hover:bg-fuchsia-100"
          >
            <img
              src="../img/carrito.png"
              alt=""
              class="h-5 w-5 md:h-6 md:w-6 object-contain"
            />
            <span id="cuenta-carrito">0</span>
          </a>

          <!-- Botón hamburguesa (solo móvil) -->
          <button
            id="btn-menu"
            type="button"
            aria-label="Abrir menú"
            aria-expanded="false"
            aria-controls="menu-movil"
            class="md:hidden p-2 rounded hover:bg-fuchsia-100"
          >
            <svg
              class="h-6 w-6"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              viewBox="0 0 24 24"
            >
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
        </div>

        <!-- Menú desplegable móvil -->
        <nav
          id="menu-movil"
          class="hidden md:hidden absolute top-full inset-x-0 bg-fuchsia-200 border-t border-pink-950 shadow-lg"
          aria-label="Principal móvil"
        >
          <ul class="flex flex-col py-1">
            <li>
              <a
                href="../index.html"
                class="block px-5 py-3 hover:bg-fuchsia-100"
                >Inicio</a
              >
            </li>
            <li>
              <a
                href="producto.html"
                class="block px-5 py-3 hover:bg-fuchsia-100"
                >Productos</a
              >
            </li>
            <li>
              <a
                href="contacto.html"
                class="block px-5 py-3 hover:bg-fuchsia-100"
                >Contacto</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="flex-1 p-4 md:p-8">
      <p
        id="carrito-vacio"
        class="hidden text-center my-16 text-lg md:text-2xl font-semibold text-pink-950"
      >
        ¡Ups! El carrito está vacío,
        <a href="producto.html" class="underline text-pink-600 font-semibold"
          >elige algunas prendas</a
        >
      </p>

      <section
        id="productos-contenedor"
        class="flex flex-col gap-5 w-[500px] max-w-full mx-auto"
      ></section>

      <section id="totales" class="mt-8">
        <p class="text-center">
          Total de unidades: <span id="unidades">0</span>
        </p>
        <p class="text-center">Precio total: $<span id="precio">0</span></p>
        <div class="flex justify-center gap-3 mt-3">
          <button
            disabled
            class="bg-pink-500 hover:bg-pink-300 text-white font-semibold px-2 py-1 rounded-lg cursor-pointer transition duration-300"
          >
            Comprar
          </button>
          <button
            id="reiniciar"
            class="bg-pink-500 hover:bg-pink-700 text-white font-semibold px-2 py-1 rounded-lg cursor-pointer transition duration-300"
          >
            Reiniciar Carrito
          </button>
        </div>
      </section>
    </main>

    <footer class="px-5 py-6 border-t-2 border-pink-950 text-center text-sm">
      <p>Todos los derechos reservados &copy; 2026 Cuidado Con el Gato</p>
    </footer>

    <script>
      const btnMenu = document.getElementById("btn-menu");
      const menuMovil = document.getElementById("menu-movil");
      btnMenu.addEventListener("click", () => {
        const abierto = menuMovil.classList.toggle("hidden") === false;
        btnMenu.setAttribute("aria-expanded", abierto);
      });
    </script>
    <script src="../js/cartService.js"></script>
    <script src="../js/cart.js"></script>
  </body>
</html>
